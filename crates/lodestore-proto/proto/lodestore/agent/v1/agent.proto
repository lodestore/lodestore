syntax = "proto3";

package lodestore.agent.v1;

service Enrollment {
  rpc GetTrustAnchor(GetTrustAnchorRequest) returns (TrustAnchor);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

service Agent {
  rpc Session(stream AgentMessage) returns (stream ServerMessage);
  rpc Renew(RenewRequest) returns (RenewResponse);
  rpc RestorePlan(RestorePlanRequest) returns (stream RestorePlanBatch);
  rpc RefreshPackAccess(RefreshPackAccessRequest) returns (RefreshPackAccessResponse);
  rpc ReadPackRange(ReadPackRangeRequest) returns (stream PackBytes);
}

message Versions {
  uint32 min = 1;
  uint32 max = 2;
}

message GetTrustAnchorRequest {}

message TrustAnchor {
  string ca_pem = 1;
}

message EnrollRequest {
  string join_secret = 1;
  bytes csr_der = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string agent_version = 6;
  Versions versions = 7;
  string previous_agent_id = 8;
}

message EnrollResponse {
  string agent_id = 1;
  string leaf_pem = 2;
  string ca_pem = 3;
  int64 issued_at = 4;
  int64 expires_at = 5;
  string writer_keys_text = 6;
  RepoLocation location = 7;
  S3Credentials agent_s3 = 8;
  uint32 selected_version = 9;
  int64 server_time = 10;
}

message RepoLocation {
  string backend = 1;
  map<string, string> options = 2;
  string repository_id = 3;
}

message S3Credentials {
  string access_key_id = 1;
  string secret_access_key = 2;
}

message AgentMessage {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    JobAccepted job_accepted = 3;
    JobRejected job_rejected = 4;
    JobPhase job_phase = 5;
    JobProgress job_progress = 6;
    JobEvents job_events = 7;
    JobFinished job_finished = 8;
    JobCreated job_created = 9;
  }
}

message Hello {
  Versions versions = 1;
  string agent_version = 2;
  repeated JobReport jobs = 3;
  repeated string capabilities = 4;
}

message Heartbeat {
  int64 uptime_s = 1;
  string kernel = 2;
  string distro = 3;
  repeated Mount mounts = 4;
  HookFacts hook_facts = 5;
}

message Mount {
  string path = 1;
  string fs_type = 2;
  uint64 total_bytes = 3;
  uint64 free_bytes = 4;
}

message ServerMessage {
  oneof body {
    HelloAck hello_ack = 1;
    UpdateS3Credentials update_s3_credentials = 2;
    Disconnect disconnect = 3;
    JobAssign job_assign = 4;
    JobCancel job_cancel = 5;
    JobSync job_sync = 6;
    JobFinishedAck job_finished_ack = 7;
    JobForget job_forget = 8;
  }
}

message HelloAck {
  uint32 selected_version = 1;
  int64 server_time = 2;
}

message UpdateS3Credentials {
  S3Credentials credentials = 1;
}

enum DisconnectReason {
  DISCONNECT_REASON_UNSPECIFIED = 0;
  DISCONNECT_REASON_REVOKED = 1;
  DISCONNECT_REASON_REPLACED = 2;
  DISCONNECT_REASON_SHUTDOWN = 3;
}

message Disconnect {
  DisconnectReason reason = 1;
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  string leaf_pem = 1;
  int64 issued_at = 2;
  int64 expires_at = 3;
}

message HookFacts {
  bool allow_inline = 1;
  repeated HookScript scripts = 2;
}

message HookScript {
  string name = 1;
  bool ok = 2;
}

message Hook {
  string script = 1;
  string command = 2;
  repeated string args = 3;
  uint32 timeout_s = 4;
}

message JobSpec {
  string policy_name = 1;
  repeated string paths = 2;
  repeated string exclude = 3;
  bool one_file_system = 4;
  bool exclude_caches = 5;
  repeated Hook before = 6;
  repeated Hook after = 7;
  repeated string tags = 8;
  string stdin_name = 9;
  Limits limits = 10;
}

enum IoniceClass {
  IONICE_CLASS_UNSPECIFIED = 0;
  IONICE_CLASS_BEST_EFFORT = 1;
  IONICE_CLASS_IDLE = 2;
}

message Limits {
  uint64 upload_rate_bps = 1;
  uint32 nice = 2;
  IoniceClass ionice_class = 3;
  uint32 ionice_level = 4;
}

message JobAssign {
  string job_id = 1;
  JobSpec spec = 2;
  RestoreSpec restore = 3;
}

message JobCancel {
  string job_id = 1;
}

message JobFinishedAck {
  string job_id = 1;
}

message JobForget {
  string job_id = 1;
}

message JobSync {
  string job_id = 1;
  uint64 resend_events_from = 2;
}

message JobAccepted {
  string job_id = 1;
  int64 started_at_ms = 2;
}

message JobRejected {
  string job_id = 1;
  string code = 2;
  string message = 3;
}

enum JobPhaseKind {
  JOB_PHASE_KIND_UNSPECIFIED = 0;
  JOB_PHASE_KIND_PRE_HOOK = 1;
  JOB_PHASE_KIND_BACKUP = 2;
  JOB_PHASE_KIND_POST_HOOK = 3;
  JOB_PHASE_KIND_SNAPSHOT = 4;
  JOB_PHASE_KIND_RESTORE_PLAN = 5;
  JOB_PHASE_KIND_RESTORE_FILES = 6;
  JOB_PHASE_KIND_RESTORE_METADATA = 7;
}

message JobPhase {
  string job_id = 1;
  JobPhaseKind phase = 2;
  string script = 3;
}

message JobProgress {
  string job_id = 1;
  uint64 files_done = 2;
  uint64 bytes_done = 3;
  uint64 bytes_uploaded = 4;
  uint64 files_total = 5;
  uint64 bytes_total = 6;
  bool scan_done = 7;
  uint64 speed_bps = 8;
  optional uint64 eta_s = 9;
  uint64 bytes_downloaded = 10;
  uint64 upload_speed_bps = 11;
}

enum JobEventLevel {
  JOB_EVENT_LEVEL_UNSPECIFIED = 0;
  JOB_EVENT_LEVEL_INFO = 1;
  JOB_EVENT_LEVEL_WARNING = 2;
  JOB_EVENT_LEVEL_ERROR = 3;
}

message JobEvent {
  uint64 seq = 1;
  int64 at_ms = 2;
  JobEventLevel level = 3;
  string kind = 4;
  string path = 5;
  string script = 6;
  string message = 7;
}

message JobEvents {
  string job_id = 1;
  repeated JobEvent events = 2;
}

message JobStats {
  uint64 files_new = 1;
  uint64 files_changed = 2;
  uint64 files_unchanged = 3;
  uint64 dirs = 4;
  uint64 bytes_total = 5;
  uint64 bytes_read = 6;
  uint64 bytes_added = 7;
}

enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  JOB_OUTCOME_SUCCEEDED = 1;
  JOB_OUTCOME_WARNINGS = 2;
  JOB_OUTCOME_FAILED = 3;
  JOB_OUTCOME_CANCELLED = 4;
  JOB_OUTCOME_INTERRUPTED = 5;
}

message JobFinished {
  string job_id = 1;
  JobOutcome outcome = 2;
  string snapshot_id = 3;
  string parent_id = 4;
  JobStats stats = 5;
  bool incomplete = 6;
  uint64 errors_total = 7;
  uint64 warnings_total = 8;
  string error_code = 9;
  string error_message = 10;
  map<string, string> error_detail = 11;
  int64 finished_at_ms = 12;
  uint64 last_event_seq = 13;
  RestoreStats restore = 14;
}

message JobCreated {
  string job_id = 1;
  JobSpec spec = 2;
  uint32 caller_uid = 3;
  uint32 caller_gid = 4;
  int64 created_at_ms = 5;
}

enum JobReportState {
  JOB_REPORT_STATE_UNSPECIFIED = 0;
  JOB_REPORT_STATE_ACCEPTED = 1;
  JOB_REPORT_STATE_RUNNING = 2;
  JOB_REPORT_STATE_FINISHED = 3;
}

message JobReport {
  string job_id = 1;
  JobReportState state = 2;
  uint64 last_event_seq = 3;
  JobFinished finished = 4;
  JobCreated created = 5;
}

enum ConflictPolicy {
  CONFLICT_POLICY_UNSPECIFIED = 0;
  CONFLICT_POLICY_OVERWRITE_CHANGED = 1;
  CONFLICT_POLICY_SKIP_EXISTING = 2;
  CONFLICT_POLICY_STOP_IF_NOT_EMPTY = 3;
}

message RestoreSpec {
  string snapshot_id = 1;
  bytes source_repo_id = 2;
  bytes k_id = 3;
  string destination = 4;
  bool in_place = 5;
  ConflictPolicy conflict = 6;
  bool restore_owners = 7;
}

message RestoreStats {
  uint64 created = 1;
  uint64 overwritten = 2;
  uint64 skipped = 3;
  uint64 files = 4;
  uint64 bytes = 5;
}

message RestorePlanRequest {
  string job_id = 1;
}

message RestoreTotals {
  uint64 files = 1;
  uint64 bytes = 2;
}

message PackAccess {
  uint32 pack = 1;
  bytes pack_id = 2;
  bytes key = 3;
  string url = 4;
  int64 expires_at_ms = 5;
}

message ChunkLoc {
  uint32 pack = 1;
  uint32 offset = 2;
  uint32 enc_len = 3;
  uint32 ulen = 4;
  bytes id = 5;
}

message PlanEnter {
  bytes node = 1;
  bool ancestor = 2;
}

message PlanEntry {
  bytes node = 1;
  repeated ChunkLoc chunks = 2;
  bool more = 3;
}

message PlanChunks {
  repeated ChunkLoc chunks = 1;
  bool more = 2;
}

message PlanLeave {}

message PlanItem {
  oneof kind {
    PlanEnter enter = 1;
    PlanEntry entry = 2;
    PlanChunks chunks = 3;
    PlanLeave leave = 4;
  }
}

message RestorePlanBatch {
  RestoreTotals totals = 1;
  repeated PackAccess packs = 2;
  repeated PlanItem items = 3;
  // Set on the final batch only. A stream that ends without it was cut short.
  bool last = 4;
}

message RefreshPackAccessRequest {
  string job_id = 1;
  repeated uint32 packs = 2;
}

message RefreshPackAccessResponse {
  repeated PackAccess packs = 1;
}

message ReadPackRangeRequest {
  string job_id = 1;
  uint32 pack = 2;
  uint64 offset = 3;
  uint32 length = 4;
}

message PackBytes {
  bytes data = 1;
}
