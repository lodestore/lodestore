[package]
name = "lodestore-server"
description = "Lodestore control plane and catalog"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "lodestore-server"
path = "src/main.rs"

[features]
embed-ui = ["dep:rust-embed"]

[dependencies]
lodestore-format = { path = "../lodestore-format" }
lodestore-proto = { path = "../lodestore-proto" }
lodestore-policy = { path = "../lodestore-policy", features = ["openapi"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14.6", default-features = false, features = ["router", "transport", "codegen", "tls-aws-lc"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "catch-panic", "set-header"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "any", "migrate", "macros"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
time = "0.3"
rustls-pki-types = "1.15.1"
argon2 = "0.6.0"
governor = "0.10.4"
yaml_serde = "0.10.7"
reqsign-aws-v4 = "3.3.1"
reqsign-core = "3.3.2"
reqsign-file-read-tokio = "3.0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
http = "1"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "server-graceful"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "pool", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
sha2 = "0.11.1"
zeroize = "1.9.1"
getrandom = "0.4.3"
data-encoding = "2.11.1"
semver = "1"
globset = { version = "0.4.20", default-features = false }
blake3 = "1.8.7"
rustix = { version = "1.1.6", features = ["system"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = "0.14.3"
rust-embed = { version = "8.13.0", optional = true }

[dev-dependencies]
lodestore-format = { path = "../lodestore-format", features = ["test-hooks"] }
tempfile = "3.27.0"
bytes = "1"
opendal = { version = "0.59.4", default-features = false, features = ["services-s3"] }
tokio = { version = "1.53.2", features = ["macros"] }
lodestore-testkit = { path = "../lodestore-testkit" }
lodestore-agent = { path = "../lodestore-agent" }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
