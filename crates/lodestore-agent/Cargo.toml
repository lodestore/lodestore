[package]
name = "lodestore-agent"
description = "Lodestore host agent"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "lodestore_agent"
path = "src/lib.rs"

[[bin]]
name = "lodestore-agent"
path = "src/main.rs"

[dependencies]
lodestore-proto = { path = "../lodestore-proto" }
lodestore-format = { path = "../lodestore-format" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "sync", "process", "io-util"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pki-types = "1.15.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "tokio"] }
tower = "0.5"
http = "1"
webpki-roots = "1.0.9"
sha2 = "0.11.1"
data-encoding = "2.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustix = { version = "1.1.5", features = ["fs", "system", "process"] }
getrandom = "0.4.3"
zeroize = "1.9.1"
yaml_serde = "0.10.7"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
