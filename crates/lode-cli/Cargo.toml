[package]
name = "lode-cli"
description = "Lodestore command line client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "lode"
path = "src/main.rs"

[dependencies]
lodestore-format = { path = "../lodestore-format" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "signal", "time", "net"] }
anyhow = "1.0.104"
tracing-subscriber = "0.3.23"
zeroize = "1.9.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
indicatif = "0.18.6"
data-encoding = "2.11.1"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
lodestore-testkit = { path = "../lodestore-testkit" }
lodestore-agent = { path = "../lodestore-agent" }
tokio-util = "0.7"
axum = "0.8.9"
