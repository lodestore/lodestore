services:
  agent-4:
    profiles: [addhost]
    image: lodestore-demo-agent:${LODESTORE_VERSION}
    pull_policy: never
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    user: "10001:10001"
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 128
    hostname: agent-4
    environment:
      AGENT_NAME: demo-app-01
      HOME: /agent/state
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - agent-4:/agent
      - seed:/seed
    networks:
      - backend
    depends_on:
      lodestore:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  agent-4:

secrets:
  unlock_key:
    file: ../../docs/demo/.out/unlock_key
