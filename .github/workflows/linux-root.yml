name: linux-root

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: nextest@0.9.148
      - run: sudo apt-get install -y acl
      - run: scripts/test-linux.sh --root fidelity_root_ --no-fail-fast
      - run: scripts/test-linux.sh --root backup_root_ --no-fail-fast
      - run: scripts/install-minisign.sh
      - run: BINS=lodestore-agent PKG=lodestore-server scripts/test-linux.sh --root e2e_install_ --no-fail-fast
      - run: cargo nextest run -p lodestore-server --run-ignored only -E 'binary(install_verify)'
      - run: BINS=lodestore-agent PKG=lodestore-agent scripts/test-linux.sh --root update_systemd_ --no-fail-fast
      - run: cargo nextest run -p lodestore-format --run-ignored only --no-fail-fast -E 'test(/^s3_/)'
