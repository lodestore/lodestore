name: linux-root

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get install -y acl
      - run: scripts/test-linux.sh --root fidelity_root_
      - run: scripts/test-linux.sh --root backup_root_
      - run: cargo nextest run -p lodestore-format --run-ignored only -E 'test(/^s3_/)'
