name: build

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Install zig
        run: |
          version=$(sed -n 's/^ARG ZIGLANG_VERSION=//p' deploy/docker/Dockerfile)
          pip install "ziglang==$version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Build the web UI
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - run: scripts/build-musl.sh dist --server x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: musl
          path: dist/
          retention-days: 7

  docker-kind:
    needs: [musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: musl
          path: dist
      - run: scripts/image-context.sh dist ctx
      - run: >-
          docker buildx build -f deploy/docker/Dockerfile.dist
          --platform linux/amd64 --provenance=false --sbom=false
          --load -t lodestore:ci ctx
      - run: scripts/smoke-docker.sh lodestore:ci
      - name: Install kind
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - run: kind create cluster --wait 120s
      - run: kind load docker-image lodestore:ci
      - name: Install the chart
        run: |
          helm install lodestore deploy/helm/lodestore \
            --set image.repository=lodestore \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set grpc.publicAddress=lodestore-grpc:8443 \
            --set grpc.service.type=NodePort \
            --set metrics.port=9464 \
            --wait --timeout 180s
      - name: Check the hardened pod
        run: |
          got=$(kubectl get pod lodestore-0 -o jsonpath='{.spec.automountServiceAccountToken} {.spec.securityContext.seccompProfile.type} {.spec.containers[0].securityContext.readOnlyRootFilesystem}')
          if [ "$got" != "false RuntimeDefault true" ]; then
            echo "unexpected pod hardening: $got" >&2
            exit 1
          fi
          if kubectl logs statefulset/lodestore | grep -qi 'read-only file system'; then
            kubectl logs statefulset/lodestore >&2
            exit 1
          fi
      - name: Check the metrics Service and the network policy
        run: |
          if kubectl get svc lodestore -o jsonpath='{.spec.ports[*].name}' | grep -q metrics; then
            echo "the shared Service exposes metrics" >&2
            exit 1
          fi
          kubectl get svc lodestore-metrics
          kubectl get networkpolicy lodestore
      - name: Check /healthz through the Service
        run: |
          kubectl port-forward svc/lodestore 18080:8080 &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          kubectl logs statefulset/lodestore >&2
          exit 1

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lodestore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LODESTORE_TEST_POSTGRES_URL: postgres://postgres:lodestore@127.0.0.1:5432/postgres
      LODESTORE_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: nextest@0.9.148
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - run: cargo nextest run -p lodestore-server --no-fail-fast

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: helm lint deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only
      - run: helm template lodestore deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only
      - run: helm lint deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only --set networkPolicy.enabled=false
      - run: helm lint deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only --set serviceAccount.create=false
      - name: Check the metrics Service and the network policy
        run: |
          helm template lodestore deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only --set metrics.port=9464 >rendered.yaml
          ! helm template lodestore deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only --set metrics.port=9464 -s templates/service.yaml | grep -q 'name: metrics'
          grep -q 'name: lodestore-metrics' rendered.yaml
          grep -q 'kind: NetworkPolicy' rendered.yaml

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
