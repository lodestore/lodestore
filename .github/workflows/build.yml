name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Install zig
        run: |
          version=$(sed -n 's/^ARG ZIGLANG_VERSION=//p' deploy/docker/Dockerfile)
          pip install "ziglang==$version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Build the web UI
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - run: scripts/build-musl.sh dist --server x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musl
          path: dist/
          retention-days: 7

  docker-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f deploy/docker/Dockerfile -t lodestore:ci .
      - run: scripts/smoke-docker.sh lodestore:ci
      - name: Install kind
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - run: kind create cluster --wait 120s
      - run: kind load docker-image lodestore:ci
      - name: Install the chart
        run: |
          helm install lodestore deploy/helm/lodestore \
            --set image.repository=lodestore \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set grpc.publicAddress=lodestore-grpc:8443 \
            --set grpc.service.type=NodePort \
            --wait --timeout 180s
      - name: Check /healthz through the Service
        run: |
          kubectl port-forward svc/lodestore 18080:8080 &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          kubectl logs statefulset/lodestore >&2
          exit 1

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lodestore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LODESTORE_TEST_POSTGRES_URL: postgres://postgres:lodestore@127.0.0.1:5432/postgres
      LODESTORE_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: nextest@0.9.148
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - run: cargo nextest run -p lodestore-server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: helm lint deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only
      - run: helm template lodestore deploy/helm/lodestore --set grpc.publicAddress=lodestore.example:8443 --set unlockKey=ci-render-only

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
