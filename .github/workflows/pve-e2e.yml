name: pve-e2e

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: pve-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  pve-e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pve-e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the runner for the nested lab
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils
          sudo ip link set lo multicast on
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: nextest@0.9.148
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/lodestore-nested-pve/*.qcow2
          key: pve-lab-image-${{ hashFiles('scripts/pve/nested-pve.sh') }}
      - run: scripts/pve/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pve-e2e-logs
          path: target/pve-e2e/
          retention-days: 7
