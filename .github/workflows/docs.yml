name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      PUBLIC_LIVE_DEMO_URL: ${{ vars.PUBLIC_LIVE_DEMO_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build
      - run: pnpm --dir docs check
      - name: No CI markers in built pages
        run: "! grep -rlE 'ci:(run-server|setup-link|install-agent|restore-without-server)' docs/dist"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: site
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site-dist
          path: dist
      - name: Upload with rrsync
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_HOST: ${{ secrets.SITE_HOST }}
          SITE_KNOWN_HOSTS: lodestore-site ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILoIKdeeSIq368StjY1S3xHwSoUpwLgDx1z6G0Wr11Rk
        run: |
          set -eu
          : "${SITE_HOST:?}"
          install -m 600 /dev/null key
          printf '%s\n' "$SITE_DEPLOY_KEY" > key
          printf '%s\n' "$SITE_KNOWN_HOSTS" > known_hosts
          rsync -rlt --delete-after --delay-updates --chmod=D755,F644 \
            -e "ssh -i key -o IdentitiesOnly=yes -o BatchMode=yes -o HostKeyAlias=lodestore-site -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes" \
            dist/ "lodestore-site@${SITE_HOST}:."
          rm -f key
