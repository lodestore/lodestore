name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Forbid openssl-sys and ring on every target
        run: |
          for pkg in openssl-sys ring; do
            status=0
            out=$(cargo tree --workspace --target all -i "$pkg" 2>&1) || status=$?
            if [ "$status" -ne 0 ] && printf '%s\n' "$out" | grep -q 'did not match any packages'; then
              continue
            fi
            if [ "$status" -eq 0 ] && printf '%s\n' "$out" | grep -q 'nothing to print'; then
              continue
            fi
            echo "$pkg check failed or $pkg is in the dependency tree (exit $status):" >&2
            echo "$out" >&2
            exit 1
          done
      - name: Keep test hooks out of release builds
        run: |
          out=$(cargo tree --workspace -e features,no-dev -i lodestore-format)
          if printf '%s\n' "$out" | grep -q 'feature "test-hooks"'; then
            echo "lodestore-format feature test-hooks is enabled outside dev-dependencies:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: Mutation skips have reasons and stay pinned
        run: scripts/mutants-ratchet.sh --skips .github/mutants-baseline.json
      - name: Mutation baseline only goes down
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          scripts/mutants-ratchet.sh --lower-only .github/mutants-baseline.json "origin/$BASE_REF"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: nextest@0.9.148
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - name: Run the workspace tests
        shell: bash
        run: |
          cargo nextest run --workspace --profile ci --no-fail-fast 2>&1 | tee nextest.log
          grep -E '^ +FLAKY' nextest.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Run the compromised-agent suite
        shell: bash
        run: cargo nextest run --workspace --profile adversarial --no-fail-fast

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses bans sources

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-dco.sh --self-test
      - name: Check the sign-off of every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: scripts/install-minisign.sh
      - run: scripts/check-version.sh --self-test
      - run: scripts/release-sign.sh --self-test

  fixtures-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the v1 fixtures with the base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/check-fixtures-append-only.sh "origin/$BASE_REF"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "no previous commit to compare with"
          else
            scripts/check-fixtures-append-only.sh "$BEFORE"
          fi
