name: quickstart

on:
  pull_request:
    branches: [main]
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      dist-artifact:
        type: string
        default: ""
      image-artifact:
        type: string
        default: ""
      published-version:
        type: string
        default: ""
  workflow_call:
    inputs:
      dist-artifact:
        type: string
        default: ""
      image-artifact:
        type: string
        default: ""
      published-version:
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          DIST_ARTIFACT: ${{ inputs.dist-artifact }}
          IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
          PUBLISHED_VERSION: ${{ inputs.published-version }}
        run: |
          if [ -z "$DIST_ARTIFACT$IMAGE_ARTIFACT$PUBLISHED_VERSION" ]; then
            mode=build
          elif [ -n "$DIST_ARTIFACT" ] && [ -n "$IMAGE_ARTIFACT" ] && [ -z "$PUBLISHED_VERSION" ]; then
            mode=candidate
          elif [ -z "$DIST_ARTIFACT$IMAGE_ARTIFACT" ] && [ -n "$PUBLISHED_VERSION" ]; then
            mode=published
          else
            echo "unsupported inputs: dist-artifact and image-artifact go together, published-version stands alone" >&2
            exit 1
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        if: steps.mode.outputs.mode == 'build'
        run: rustup show active-toolchain || rustup toolchain install
      - if: steps.mode.outputs.mode == 'build'
        run: rustup target add x86_64-unknown-linux-musl
      - if: steps.mode.outputs.mode == 'build'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - if: steps.mode.outputs.mode == 'build'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - if: steps.mode.outputs.mode == 'build'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Install zig
        if: steps.mode.outputs.mode == 'build'
        run: |
          version=$(sed -n 's/^ARG ZIGLANG_VERSION=//p' deploy/docker/Dockerfile)
          pip install "ziglang==$version"
      - if: steps.mode.outputs.mode == 'build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Build the web UI
        if: steps.mode.outputs.mode == 'build'
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - if: steps.mode.outputs.mode == 'build'
        run: scripts/build-musl.sh dist --server x86_64-unknown-linux-musl
      - if: steps.mode.outputs.mode == 'build'
        run: scripts/image-context.sh dist ctx
      - if: steps.mode.outputs.mode == 'build'
        run: >-
          docker buildx build -f deploy/docker/Dockerfile.dist
          --platform linux/amd64 --provenance=false --sbom=false
          --load -t lodestore:quickstart ctx
      - if: steps.mode.outputs.mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quickstart-dist
          path: dist/
          retention-days: 2
      - if: steps.mode.outputs.mode == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist
      - if: steps.mode.outputs.mode == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.image-artifact }}
          path: dist
      - name: Load the candidate image
        if: steps.mode.outputs.mode == 'candidate'
        run: |
          chmod 0755 dist/lode-linux-x86_64
          docker load -i dist/image-amd64.tar
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - if: steps.mode.outputs.mode == 'build'
        run: scripts/quickstart-ci.sh lodestore:quickstart
      - if: steps.mode.outputs.mode == 'candidate'
        run: scripts/quickstart-ci.sh lodestore:candidate-amd64
      - if: steps.mode.outputs.mode == 'published'
        run: scripts/install-minisign.sh
      - if: steps.mode.outputs.mode == 'published'
        env:
          PUBLISHED_VERSION: ${{ inputs.published-version }}
        run: scripts/quickstart-ci.sh "ghcr.io/lodestore/lodestore:$PUBLISHED_VERSION" --published "$PUBLISHED_VERSION"

  e2e:
    needs: quickstart
    if: needs.quickstart.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quickstart-dist
          path: dist
      - run: chmod 0755 dist/*
      - run: scripts/image-context.sh dist ctx
      - run: >-
          docker buildx build -f deploy/docker/Dockerfile.dist
          --platform linux/amd64 --provenance=false --sbom=false
          --load -t lodestore:quickstart ctx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install the browser test tooling
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/test-bin
          key: test-bin-minio-RELEASE.2025-09-07T16-13-09Z-mc-RELEASE.2025-08-13T08-35-41Z
      - run: scripts/quickstart-ci.sh lodestore:quickstart --e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
