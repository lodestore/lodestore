name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first, a duplicate is closed in favor of the older one.
        Do not report a security vulnerability here: use [private vulnerability reporting](https://github.com/lodestore/lodestore/security/advisories/new) (see SECURITY.md). For questions, use [Discussions](https://github.com/lodestore/lodestore/discussions).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lodestore-server --version` or `lodestore-agent version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage
      description: Where the repository lives.
      options:
        - AWS S3
        - MinIO
        - Ceph
        - Other S3-compatible
        - Local folder
        - NFS
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords, keys and tokens before pasting.
      render: shell
