[test-groups]
system-install = { max-threads = 1 }

[profile.default]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "test(/^e2e_install_/)"
test-group = "system-install"

[profile.ci]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[[profile.ci.overrides]]
filter = "test(/^e2e_install_/)"
test-group = "system-install"

[[profile.ci.overrides]]
filter = "test(reenroll_keeps_agent_id_and_rebinds_snapshots)"
retries = 3
