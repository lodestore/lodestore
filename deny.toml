[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "ring" },
]

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is pulled in by the Azure and GCS request signers; the GCS service-account key signs only the token request on the host that owns it, and the attack needs precisely timed observation of many signatures next to that process" },
    { id = "RUSTSEC-2026-0459", reason = "sqlx-sqlite 0.9 caps libsqlite3-sys below 0.38, and the server opens only SQLite files it created in its own data directory" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
