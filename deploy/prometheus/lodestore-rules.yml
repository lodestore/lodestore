groups:
  - name: lodestore-backups
    rules:
      - alert: LodestoreBackupFailed
        expr: lodestore_backup_last_status == 0
        labels:
          severity: critical
        annotations:
          summary: "Backup failed on {{ $labels.host }}"
          description: "Policy {{ $labels.policy }}: the last backup on {{ $labels.host }} failed."
      - alert: LodestoreNoRecentBackup
        expr: lodestore_backup_overdue == 1
        labels:
          severity: warning
        annotations:
          summary: "No recent backup on {{ $labels.host }}"
          description: "Policy {{ $labels.policy }}: the last successful backup on {{ $labels.host }} is older than the policy allows."
  - name: lodestore-agents
    rules:
      - alert: LodestoreAgentOffline
        expr: lodestore_host_agent_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} is offline"
          description: "The agent on {{ $labels.host }} has not been connected for 15 minutes."
      - alert: LodestoreAgentUpdateFailed
        expr: lodestore_host_agent_update_failed == 1
        labels:
          severity: critical
        annotations:
          summary: "Agent update failed on {{ $labels.host }}"
          description: "The last agent update of {{ $labels.host }} was rolled back and the host is not on its target version. The reason is in Jobs, Agent update."
      - alert: LodestoreAgentSessionConflict
        expr: lodestore_alerts_active{type="agent_session_conflict"} > 0
        labels:
          severity: warning
        annotations:
          summary: "Two live sessions of one agent"
          description: "A live session of an agent was replaced from another network, or live sessions were replaced over and over. If a host was cloned, re-enroll the copy with a new join token. The host is named in the alert in Lodestore."
      - alert: LodestoreAgentCertificateRejected
        expr: lodestore_alerts_active{type="agent_certificate_rejected"} > 0
        labels:
          severity: critical
        annotations:
          summary: "The server refused an agent certificate"
          description: "An agent presented a certificate that is not the one the server issued last. If the host is legitimate, re-enroll it with a new join token. The host, serial and address are in the alert in Lodestore."
  - name: lodestore-repositories
    rules:
      - alert: LodestoreCheckFailed
        expr: lodestore_check_last_status == 0
        labels:
          severity: critical
        annotations:
          summary: "{{ if eq $labels.level \"packs\" }}Pack reading{{ else if eq $labels.level \"restore\" }}Test restore{{ else }}Structure{{ end }} check failed on {{ $labels.repository }}"
          description: "The last {{ $labels.level }} check of repository {{ $labels.repository }} found problems or stopped. Open the report in Integrity checks."
      - alert: LodestoreSnapshotQuarantined
        expr: lodestore_alerts_active{type="snapshot_quarantined"} > 0
        labels:
          severity: critical
        annotations:
          summary: "A snapshot cannot be read and cleanup is stopped"
          description: "Open the repository page in Lodestore, Free up space, and review the quarantined snapshots."
      - alert: LodestoreRepositoryUnavailable
        expr: lodestore_alerts_active{type="repository_unavailable"} > 0
        labels:
          severity: critical
        annotations:
          summary: "A repository is unavailable"
          description: "The server does not open a repository whose configuration in storage does not match what it recorded. See Storage checks on the repository page."
  - name: lodestore-certificates
    rules:
      - alert: LodestoreCertificateExpiring
        expr: |
          (lodestore_host_cert_expiry_timestamp_seconds - time() < 14 * 86400)
          or
          (lodestore_server_cert_expiry_timestamp_seconds - time() < 14 * 86400)
        labels:
          severity: warning
        annotations:
          summary: "{{ if $labels.host }}Agent certificate on {{ $labels.host }}{{ else }}Server gRPC certificate{{ end }} {{ if lt $value 0.0 }}has expired{{ else }}expires in {{ $value | humanizeDuration }}{{ end }}"
          description: "Agent certificates renew while the agent is online and the built-in server certificate renews itself. A certificate you supplied has to be replaced by hand."
