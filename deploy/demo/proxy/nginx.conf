limit_req_zone $binary_remote_addr zone=lodestore_demo_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lodestore_demo_signin:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lodestore_demo_download:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lodestore_demo_binary:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=lodestore_demo_conn:10m;
limit_conn_zone $binary_remote_addr zone=lodestore_demo_archive:1m;

upstream lodestore_demo {
    server 127.0.0.1:18080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.example.com;

    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn lodestore_demo_conn 64;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /api/v1/auth/demo {
        limit_req zone=lodestore_demo_signin burst=10 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location = /api/v1/downloads {
        limit_req zone=lodestore_demo_download burst=6 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location ~ ^/api/v1/downloads/[^/]+/archive$ {
        limit_req zone=lodestore_demo_download burst=6 nodelay;
        limit_conn lodestore_demo_archive 2;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_pass http://lodestore_demo;
    }

    location ~ ^/api/v1/snapshots/[^/]+/search$ {
        limit_req zone=lodestore_demo_general burst=120 nodelay;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_pass http://lodestore_demo;
    }

    location ^~ /install {
        limit_req zone=lodestore_demo_binary burst=3 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=lodestore_demo_general burst=120 nodelay;
        proxy_pass http://lodestore_demo;
    }
}
