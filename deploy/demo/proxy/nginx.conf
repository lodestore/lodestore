limit_req_zone $binary_remote_addr zone=lodestore_demo_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lodestore_demo_signin:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lodestore_demo_download:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lodestore_demo_binary:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=lodestore_demo_conn:10m;
limit_conn_zone $binary_remote_addr zone=lodestore_demo_archive:1m;

upstream lodestore_demo {
    server 127.0.0.1:18080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.example.com;

    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    limit_conn lodestore_demo_conn 64;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /api/v1/auth/demo {
        limit_req zone=lodestore_demo_signin burst=10 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location = /api/v1/downloads {
        limit_req zone=lodestore_demo_download burst=6 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location ~ ^/api/v1/downloads/[^/]+/archive$ {
        limit_req zone=lodestore_demo_download burst=6 nodelay;
        limit_conn lodestore_demo_archive 2;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_pass http://lodestore_demo;
    }

    location ~ ^/api/v1/snapshots/[^/]+/search$ {
        limit_req zone=lodestore_demo_general burst=120 nodelay;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_pass http://lodestore_demo;
    }

    location ^~ /install {
        limit_req zone=lodestore_demo_binary burst=3 nodelay;
        proxy_pass http://lodestore_demo;
    }

    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=lodestore_demo_general burst=120 nodelay;
        proxy_pass http://lodestore_demo;
    }
}
