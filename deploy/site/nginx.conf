limit_conn_zone $binary_remote_addr zone=lodestore_site_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name lodestore.dev www.lodestore.dev;
    return 301 https://lodestore.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lodestore.dev;

    ssl_certificate /etc/letsencrypt/live/lodestore.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodestore.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://lodestore.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lodestore.dev;

    ssl_certificate /etc/letsencrypt/live/lodestore.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodestore.dev/privkey.pem;

    root /opt/lodestore.dev/public;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;
    server_tokens off;
    disable_symlinks on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    limit_conn lodestore_site_conn 256;

    gzip on;
    gzip_vary on;
    gzip_types image/svg+xml application/wasm application/rss+xml application/xml text/xml application/manifest+json text/css application/javascript application/json;

    include snippets/lodestore-site-headers.conf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include snippets/lodestore-site-headers.conf;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include snippets/lodestore-site-headers.conf;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/lodestore-site-headers.conf;
    }
}
