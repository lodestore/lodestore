limit_conn_zone $binary_remote_addr zone=lodestore_site_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name lodestore.dev www.lodestore.dev;
    return 301 https://lodestore.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lodestore.dev;

    ssl_certificate /etc/letsencrypt/live/lodestore.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodestore.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://lodestore.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lodestore.dev;

    ssl_certificate /etc/letsencrypt/live/lodestore.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodestore.dev/privkey.pem;

    root /opt/lodestore.dev/public;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;
    server_tokens off;
    disable_symlinks on;
    limit_conn lodestore_site_conn 64;

    gzip on;
    gzip_vary on;
    gzip_types image/svg+xml application/wasm application/rss+xml application/xml text/xml application/manifest+json text/css application/javascript application/json;

    include snippets/lodestore-site-headers.conf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include snippets/lodestore-site-headers.conf;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include snippets/lodestore-site-headers.conf;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/lodestore-site-headers.conf;
    }
}
