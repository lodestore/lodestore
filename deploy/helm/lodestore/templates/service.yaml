apiVersion: v1
kind: Service
metadata:
  name: {{ include "lodestore.fullname" . }}
  labels:
    {{- include "lodestore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lodestore.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if gt (int .Values.metrics.port) 0 }}
    - name: metrics
      port: {{ int .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
