{{- if gt (int .Values.metrics.port) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lodestore.fullname" . }}-metrics
  labels:
    {{- include "lodestore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lodestore.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ int .Values.metrics.port }}
      targetPort: metrics
{{- end }}
