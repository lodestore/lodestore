{{- if not .Values.existingSecret }}
{{- $name := include "lodestore.fullname" . }}
{{- $unlock := .Values.unlockKey }}
{{- if not $unlock }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $unlock = get $existing.data "unlock-key" | b64dec }}
{{- if not $unlock }}
{{- fail (printf "The Secret %s exists but has no unlock-key entry. Add it, set unlockKey, or point existingSecret at a Secret that has it." $name) }}
{{- end }}
{{- else if lookup "v1" "Namespace" "" .Release.Namespace }}
{{- $unlock = randBytes 32 }}
{{- else }}
{{- fail "Cannot read the cluster, so the unlock key cannot be created or looked up safely (helm template, --dry-run, ArgoCD and Flux render without cluster access). A regenerated key would make the stored repository secrets unreadable. Set unlockKey (for example with --set-file) or create a Secret with an unlock-key entry and set existingSecret." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lodestore.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  unlock-key: {{ $unlock | b64enc }}
  {{- with .Values.adminPassword }}
  admin-password: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.externalDatabase.url }}
  database-url: {{ . | b64enc }}
  {{- end }}
{{- end }}
