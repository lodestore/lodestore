[package]
name = "lodestore-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
lodestore-fuzzkit = { path = "../crates/lodestore-fuzzkit", features = ["test-hooks"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "pack_prefix"
path = "fuzz_targets/pack_prefix.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_trailer"
path = "fuzz_targets/pack_trailer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_entries"
path = "fuzz_targets/pack_entries.rs"
test = false
doc = false
bench = false
